name: Native callable multi-donor discovery invocation and ledger

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/native-callable-rts-cross-repo.yml'
      - 'tools/callable_registry.py'
      - 'tools/invoke_declared_callable.py'
      - 'tools/js_callable_runner.mjs'
      - 'tools/python_callable_runner.py'
      - 'tools/callable_execution_ledger.py'
      - 'schemas/AXM_CALLABLE.schema.json'
      - 'schemas/AXM_MODULE.schema.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-invoke-and-ledger-multiple-donors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Monolith candidate
        uses: actions/checkout@v4

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize exact merged Global State RTS source module
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-global-state-rts
          ref: 485303329fae5839215bad9e469b2d83b1b1f109
          path: snapshot/modules/axm-global-state-rts

      - name: Materialize exact merged FrameState source module
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-framestate
          ref: fbb0fc8e9371b8ab2b36bd37e9524846c6f1441a
          path: snapshot/modules/axm-framestate

      - name: Discover native callables from both source modules without donor hard-codes
        run: |
          python tools/callable_registry.py snapshot --strict
          python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path('snapshot/CALLABLE_CAPABILITY_REGISTRY.json').read_text())
          assert registry['schema'] == 'axm.monolith.callable-capability-registry/v0.1'
          assert registry['summary']['callable_declaration_count'] == 3
          assert registry['summary']['declared_callable_not_exercised'] == 3
          assert registry['summary']['blocked_invalid_callable_declaration'] == 0

          entries = {entry['address']: entry for entry in registry['entries']}
          expected = {
              'axm-global-state-rts::asset.workshop-lod-selection',
              'axm-global-state-rts::asset.workshop-lod-installation',
              'axm-framestate::timeline.integer-sample',
          }
          assert set(entries) == expected
          assert entries['axm-global-state-rts::asset.workshop-lod-selection']['callable']['runtime'] == 'javascript-esm'
          assert entries['axm-global-state-rts::asset.workshop-lod-selection']['callable']['export'] == 'selectWorkshopRuntimeLod'
          assert entries['axm-framestate::timeline.integer-sample']['callable']['runtime'] == 'python'
          assert entries['axm-framestate::timeline.integer-sample']['callable']['export'] == 'sample'
          for entry in entries.values():
              assert entry['status'] == 'declared_callable_not_exercised'
              assert entry['source_capability_execution'] is False
              assert entry['callable']['authority'] == 'none'
              assert entry['errors'] == []

          donor_names = ('axm-global-state-rts', 'axm-framestate')
          for tool_name in ('callable_registry.py', 'invoke_declared_callable.py', 'callable_execution_ledger.py', 'python_callable_runner.py'):
              tool_path = Path('tools') / tool_name
              if not tool_path.exists():
                  continue
              text = tool_path.read_text()
              for donor in donor_names:
                  assert donor not in text, f'{tool_name} must remain donor-generic: {donor}'
          PY

      - name: Explicitly invoke JavaScript RTS selector and Python FrameState sampler
        run: |
          mkdir -p snapshot/evidence/native-callable
          printf '%s\n' '{"schema":"axm.callable-invocation-request/v0.1","args":[360]}' > snapshot/evidence/native-callable/request-rts-360.json
          printf '%s\n' '{"schema":"axm.callable-invocation-request/v0.1","args":[90]}' > snapshot/evidence/native-callable/request-rts-90.json
          printf '%s\n' '{"schema":"axm.callable-invocation-request/v0.1","args":[{"from":0,"to":100,"easing":"linear"},5,0,11]}' > snapshot/evidence/native-callable/request-framestate-sample.json

          python tools/invoke_declared_callable.py \
            snapshot \
            'axm-global-state-rts::asset.workshop-lod-selection' \
            --request snapshot/evidence/native-callable/request-rts-360.json \
            --receipt snapshot/evidence/native-callable/receipt-rts-360.json \
            --allow-javascript-esm

          python tools/invoke_declared_callable.py \
            snapshot \
            'axm-global-state-rts::asset.workshop-lod-selection' \
            --request snapshot/evidence/native-callable/request-rts-90.json \
            --receipt snapshot/evidence/native-callable/receipt-rts-90.json \
            --allow-javascript-esm

          python tools/invoke_declared_callable.py \
            snapshot \
            'axm-framestate::timeline.integer-sample' \
            --request snapshot/evidence/native-callable/request-framestate-sample.json \
            --receipt snapshot/evidence/native-callable/receipt-framestate-sample.json \
            --allow-python

          python - <<'PY'
          import json
          from pathlib import Path

          r360 = json.loads(Path('snapshot/evidence/native-callable/receipt-rts-360.json').read_text())
          r90 = json.loads(Path('snapshot/evidence/native-callable/receipt-rts-90.json').read_text())
          frame = json.loads(Path('snapshot/evidence/native-callable/receipt-framestate-sample.json').read_text())

          for receipt in (r360, r90, frame):
              assert receipt['status'] == 'exercised_with_receipt'
              assert receipt['source_capability_execution'] is True
              assert receipt['declared_callable']['authority'] == 'none'
              for key in ('manifest_sha256', 'source_file_sha256', 'request_sha256', 'response_sha256'):
                  assert receipt[key].startswith('sha256:') and len(receipt[key]) == 71

          assert r360['runtime'] == 'javascript-esm'
          assert r360['result']['distanceM'] == 360
          assert r360['result']['role'] == 'rts'
          assert r360['result']['farCandidateStatus'] == 'HOLD_DISTANCE_HANDOFF_UNPROVEN'
          assert r90['result']['distanceM'] == 90
          assert r90['result']['role'] == 'tactical'

          assert frame['address'] == 'axm-framestate::timeline.integer-sample'
          assert frame['runtime'] == 'python'
          assert frame['result'] == 50
          PY

      - name: Build one execution ledger across both donors and runtimes
        run: |
          python tools/callable_execution_ledger.py \
            snapshot \
            --receipts snapshot/evidence/native-callable \
            --strict

          python - <<'PY'
          import json
          from pathlib import Path

          ledger = json.loads(Path('snapshot/CALLABLE_EXECUTION_LEDGER.json').read_text())
          assert ledger['schema'] == 'axm.monolith.callable-execution-ledger/v0.1'
          summary = ledger['summary']
          assert summary['registry_declared_callable_count'] == 3
          assert summary['receipt_files_recorded'] == 3
          assert summary['ignored_non_receipt_json'] == 3
          assert summary['accepted_exercised_receipts'] == 3
          assert summary['observed_non_success_receipts'] == 0
          assert summary['blocked_invalid_receipts'] == 0
          assert summary['exercised_address_count'] == 2
          assert ledger['executed_addresses'] == [
              'axm-framestate::timeline.integer-sample',
              'axm-global-state-rts::asset.workshop-lod-selection',
          ]

          by_address = {row['address']: row for row in ledger['capabilities']}
          assert by_address['axm-framestate::timeline.integer-sample']['accepted_exercised_receipts'] == 1
          assert by_address['axm-framestate::timeline.integer-sample']['source_capability_execution'] is True
          assert by_address['axm-global-state-rts::asset.workshop-lod-selection']['accepted_exercised_receipts'] == 2
          assert by_address['axm-global-state-rts::asset.workshop-lod-selection']['source_capability_execution'] is True

          registry = json.loads(Path('snapshot/CALLABLE_CAPABILITY_REGISTRY.json').read_text())
          installer = next(entry for entry in registry['entries'] if entry['address'] == 'axm-global-state-rts::asset.workshop-lod-installation')
          assert installer['status'] == 'declared_callable_not_exercised'
          assert installer['source_capability_execution'] is False
          print('generic multi-donor execution: PASS (2 repos, 2 runtimes, 2 exercised addresses, unrelated installer declaration-only)')
          PY

      - name: Preserve multi-donor discovery invocation and ledger evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-callable-multi-donor-execution-ledger
          path: |
            snapshot/CALLABLE_CAPABILITY_REGISTRY.json
            snapshot/CALLABLE_EXECUTION_LEDGER.json
            snapshot/evidence/native-callable/request-rts-360.json
            snapshot/evidence/native-callable/request-rts-90.json
            snapshot/evidence/native-callable/request-framestate-sample.json
            snapshot/evidence/native-callable/receipt-rts-360.json
            snapshot/evidence/native-callable/receipt-rts-90.json
            snapshot/evidence/native-callable/receipt-framestate-sample.json
          if-no-files-found: error
          retention-days: 14
